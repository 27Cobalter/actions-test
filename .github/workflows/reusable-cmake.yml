name: reusable-cmake

on:
  workflow_call:
    inputs:
      source-dir:
        type: string
        default: "./"
      build-dir:
        type: string
        default: "build"
      cmake-options:
        type: string
      enable-build:
        type: boolean
        default: false
      enable-test:
        type: boolean
        default: false
      enable-package:
        type: boolean
        default: false
      artifact-name:
        type: string
        default: package

jobs:
  cmake-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: ${{ inputs.build-dir }}
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.yml') }}-
      - name: configure
        run: cmake -B ${{inputs.build-dir}} -S ${{inputs.source-dir}} ${{inputs.cmake-options}}
      - name: build
        if: ${{inputs.enable-build}}
        run: cmake --build ${{inputs.build-dir}}
      - name: test
        if: ${{inputs.enable-test}}
        run: cmake --build ${{inputs.build-dir}} --target test
      - name: package
        if: ${{inputs.enable-package}}
        run: cmake --build ${{inputs.build-dir}} --target package
      - name: upload
        id: upload
        if: ${{inputs.enable-package}}
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.artifact-name}}
          path: |
            ${{inputs.build-dir}}/package/actions-test-*
          if-no-files-found: error
      - uses: actions/cache/save@v4
        id: save
        with:
          path: ${{inputs.build-dir}}
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.yml') }}-${{ github.run_id }}
